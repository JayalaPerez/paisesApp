<table class="table table-hover table-striped">
            <thead>
                <tr>
                    <th>#</th>
                    <th>Bandera</th>
                    <th>Nombre</th>
                    <th>Población</th>
                    <th></th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let pais of paises; let i = index">
                    <td>{{ i + 1 }}</td>
                    <td>
                        <img [src]="pais.flag.url_png" 
                             [alt]="pais.names.common" 
                             class="small-flag" 
                             width="50">
                    </td>
                    <td>{{ pais.capitals[0].name}},{{ pais.names.common }}</td>
                    <td>{{ pais.population | number }}</td>
                    <td>
                        <a [routerLink]="['/pais', pais.codes.alpha_2]" class="btn btn-outline-primary btn-sm">
                            Más información
                        </a>
                    </td>
                </tr>
            </tbody>
        </table>
